services:
  elasticsearch:
    image: 'docker.elastic.co/elasticsearch/elasticsearch:7.17.10'
    environment:
      - 'ELASTIC_PASSWORD=secret'
      - 'discovery.type=single-node'
      - 'xpack.security.enabled=false'
    ports:
      - '9200'
      - '9300'
  postgres:
    image: 'postgres:16'
    container_name: flightcrash-postgres
    environment:
      POSTGRES_DB: flightcrash
      POSTGRES_USER: flightcrash
      POSTGRES_PASSWORD: flightcrash
    ports:
      - "5432:5432"
    volumes:
      - flightcrash_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flightcrash -d flightcrash"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  flightcrash_pgdata: